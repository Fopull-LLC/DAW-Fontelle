[workspace]
resolver = "3"
members = [
    "crates/fontelle-types",
    "crates/fontelle-dsp",
    "crates/fontelle-core",
    "crates/fontelle-fx",
    "crates/fontelle-model",
    "crates/fontelle-sequencer",
    "crates/fontelle-host",
    "crates/fontelle-engine",
    "crates/fontelle-midi",
    "crates/fontelle-assets",
    "crates/fontelle-analysis",
    "crates/fontelle-net",
    "crates/fontelle-ui",
    "crates/fontelle-plugin",
    "crates/fontelle-testplug",
    "crates/fontelle-testlv2",
    "crates/fontelle-testvst3",
    "crates/fontelle-bridge-abi",
    "crates/fontelle-testbridge",
    "crates/fontelle-app",
    "xtask",
]

[workspace.package]
# The product's version: one number for the whole workspace, which is what the
# window shows, what a release is tagged as, and what the updater compares
# against (`crates/fontelle-app/src/updates.rs`).
version = "0.26.1"
edition = "2024"
rust-version = "1.88.0"
license = "MIT OR Apache-2.0"
authors = ["Fopull LLC"]
repository = "https://github.com/Fopull-LLC/DAW-Fontelle"
publish = false

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1
# Debug information kept beside the objects, not copied into every binary:
# 415 test binaries, each with the whole workspace's, filled a 5.5 TB disk
# in a day of work (2026-10-05). Backtraces and debuggers read it as before.
split-debuginfo = "unpacked"

# Dependencies with line tables only: a backtrace through them still says
# file and line, at a fraction of the size.
[profile.dev.package."*"]
debug = "line-tables-only"
