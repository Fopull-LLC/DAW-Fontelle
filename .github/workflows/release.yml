# Builds and publishes a release when a version tag is pushed.
#
# The contract with the updater (`crates/fontelle-app/src/updates.rs`) is
# two names: the archive for each target is `fontelle-<version>-<target>`
# (`.tar.gz`, or `.zip` on Windows), and `SHA256SUMS` sits beside them in
# `sha256sum` format. `tests/updates.rs` pins both, so a change here is a
# change there.
#
# Cutting a release is Ty's call (a human gate): bump `version` in the
# workspace `Cargo.toml`, commit, then
#
#     git tag v0.2.0 && git push origin v0.2.0
#
# A beta is the same with a pre-release version — `0.27.0-beta.1` in
# `Cargo.toml`, tag `v0.27.0-beta.1` — and goes only to Beta updates.
#
# The first job refuses a tag that does not match the version in the tree,
# so the number the window shows, the tag and the archive names cannot
# drift apart. And **nothing is published from a commit CI has not passed**
# (the `ci` job): push the commit to main, then tag it. The archives build
# while CI finishes, so a green release is no slower; a red one publishes
# nothing. CI was red from v0.8.0 to v0.17.0 and ten releases shipped past it.

name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  version:
    name: The tag matches the workspace version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          version=$(cargo metadata --format-version 1 --no-deps | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "tag v$tag does not match Cargo.toml version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  ci:
    name: CI passed on this commit
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: .github/scripts/ci-passed.sh "${{ github.sha }}" "${{ github.repository }}"

  build:
    name: ${{ matrix.target }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest Ubuntu the runners offer, so the binary's glibc floor
          # is as low as it can be: Linux is the point of this project.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      NAME: fontelle-${{ needs.version.outputs.version }}-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux audio/windowing dev libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libudev-dev libxkbcommon-dev libwayland-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libdbus-1-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # On Linux, Fontelle provides the few glibc 2.38 symbols the prebuilt
      # ONNX Runtime asks for, so the build links on 22.04 and runs there
      # (`fontelle-diffsinger/src/glibc_compat.rs`; CI's `linux-release-floor`).
      - run: cargo build --release --locked -p fontelle-app --target ${{ matrix.target }} ${{ runner.os == 'Linux' && '--features old-glibc' || '' }}
      # The ASIO helper: a separate GPLv3 program (docs/asio.md), Windows
      # only. Built from this same tag, so its source is this release's.
      - name: Build the ASIO helper (windows)
        if: runner.os == 'Windows'
        run: cargo build --release --locked -p fontelle-asio-host --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "dist/$NAME"
          cp "target/${{ matrix.target }}/release/fontelle" "dist/$NAME/"
          cp LICENSE-MIT LICENSE-APACHE README.md "dist/$NAME/"
          # Third-party notices (basic-pitch's Apache-2.0 NOTICE, every
          # shipped sound's licence in licenses/SOUNDS.md) travel with the
          # program, as their licences ask.
          cp -R licenses "dist/$NAME/"
          if [ "${{ runner.os }}" = "Linux" ]; then
            cp packaging/linux/com.fopull.Fontelle.desktop packaging/linux/com.fopull.Fontelle.png packaging/linux/install.sh "dist/$NAME/"
          fi
          tar -czf "$NAME.tar.gz" -C dist "$NAME"
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/$env:NAME" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/fontelle.exe" "dist/$env:NAME/"
          Copy-Item LICENSE-MIT, LICENSE-APACHE, README.md "dist/$env:NAME/"
          Copy-Item -Recurse licenses "dist/$env:NAME/"
          # The ASIO helper beside fontelle.exe, where Fontelle looks for it,
          # with its GPLv3 licence, Steinberg's SDK terms and a word saying
          # it is a separate program and where its source is. The updater
          # carries all of it along (`updates.rs`, `install_asio_helper`).
          Copy-Item "target/${{ matrix.target }}/release/fontelle-asio.exe" "dist/$env:NAME/"
          Copy-Item packaging/windows/fontelle-asio-README.txt "dist/$env:NAME/"
          New-Item -ItemType Directory -Force -Path "dist/$env:NAME/licenses/fontelle-asio" | Out-Null
          Copy-Item crates/fontelle-asio-host/LICENSE, crates/fontelle-asio-host/STEINBERG-ASIO-SDK-LICENSE.txt "dist/$env:NAME/licenses/fontelle-asio/"
          # Steinberg's ASIO Compatible Logo, which this build shows, and the
          # notice that it is their trademark and none of Fontelle's licences
          # covers it (licenses/TRADEMARKS.md).
          New-Item -ItemType Directory -Force -Path "dist/$env:NAME/licenses/trademarks/asio" | Out-Null
          Copy-Item assets/trademarks/asio/NOTICE, assets/trademarks/asio/ASIO-compatible-logo-Steinberg-TM-BW.png "dist/$env:NAME/licenses/trademarks/asio/"
          Compress-Archive -Path "dist/$env:NAME" -DestinationPath "$env:NAME.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: |
            ${{ env.NAME }}.tar.gz
            ${{ env.NAME }}.zip
          if-no-files-found: error

  # The ASIO helper's source, attached to the release it was built in: the
  # binary in the Windows zip is GPLv3, and its Corresponding Source is
  # offered from the same place (GPLv3 §6(d)). The whole tree at this tag —
  # the helper, the protocol crate, the workspace manifest and `Cargo.lock`
  # that pins every dependency it was built with.
  helper-source:
    name: The ASIO helper's source
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          git archive --format=tar.gz --prefix="fontelle-asio-source-$VERSION/" \
            -o "fontelle-asio-source-$VERSION.tar.gz" HEAD
          tar -tzf "fontelle-asio-source-$VERSION.tar.gz" | grep -q "crates/fontelle-asio-host/src/main.rs"
      - uses: actions/upload-artifact@v4
        with:
          name: fontelle-asio-source-${{ needs.version.outputs.version }}
          path: fontelle-asio-source-${{ needs.version.outputs.version }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [version, ci, build, helper-source]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: |
          cd artifacts
          sha256sum fontelle-* > SHA256SUMS
          cat SHA256SUMS
      # A hyphenated tag (`v0.27.0-beta.1`) is a beta: published as a
      # pre-release, so `releases/latest` — the stable channel — never sees
      # it, and only machines with Beta updates on are offered it
      # (`updates::Channel`). `tests/updates.rs` pins this line.
      - uses: softprops/action-gh-release@v2
        with:
          name: Fontelle ${{ needs.version.outputs.version }}
          # The Windows download plays through ASIO by way of fontelle-asio,
          # so the notes carry Steinberg's logo and attribution (their usage
          # guidelines; docs/asio.md §1).
          body: |
            <img src="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/assets/trademarks/asio/ASIO-compatible-logo-Steinberg-TM-BW.png" alt="ASIO Compatible Logo" width="110"/>

            The Windows download can play through ASIO® drivers by way of `fontelle-asio.exe`, a separate GPLv3 program whose source is attached below as `fontelle-asio-source-${{ needs.version.outputs.version }}.tar.gz`. ASIO is a registered trademark of Steinberg Media Technologies GmbH.
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/fontelle-*
            artifacts/SHA256SUMS

  # Steam's depots from the release just published (hub card 0429,
  # docs/steam.md): `tools/steam/make-depots.sh` downloads this tag's
  # archives, checks them against SHA256SUMS and lays them out, so the bytes
  # on Steam are the bytes on the release page — nothing is rebuilt, and like
  # the release itself nothing happens unless CI passed (`publish` needs
  # `ci`). On a macOS runner because the macOS depot is one universal binary
  # and `lipo` is there. The depots and the SteamPipe scripts are a workflow
  # artifact; uploading them to Steam is Ty's step.
  steam:
    name: Steam depots
    needs: [version, publish]
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
      # Steamworks' ids, once Ty has them (repository variables, not
      # secrets: they are on the store page anyway). Unset, the scripts keep
      # FILL_ME placeholders that steamcmd refuses.
      STEAM_APP_ID: ${{ vars.STEAM_APP_ID }}
      STEAM_DEPOT_LINUX: ${{ vars.STEAM_DEPOT_LINUX }}
      STEAM_DEPOT_WINDOWS: ${{ vars.STEAM_DEPOT_WINDOWS }}
      STEAM_DEPOT_MACOS: ${{ vars.STEAM_DEPOT_MACOS }}
    steps:
      - uses: actions/checkout@v4
      - run: tools/steam/make-depots.sh "${{ github.ref_name }}" "steam-$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: fontelle-steam-${{ needs.version.outputs.version }}
          path: |
            steam-${{ needs.version.outputs.version }}/depots
            steam-${{ needs.version.outputs.version }}/scripts
          if-no-files-found: error
      # Off until Ty has a Steamworks builder account and wants uploads from
      # CI: it needs STEAM_USERNAME and a STEAM_CONFIG_VDF (steamcmd's
      # config.vdf after a Steam Guard login) as secrets. Even then the build
      # goes up to no branch (`SetLive` is empty); setting it live stays a
      # click on the Steamworks site.
      - name: Upload to Steam (disabled)
        if: false
        run: |
          echo "steamcmd +login \"$STEAM_USERNAME\" +run_app_build \"$PWD/steam-$VERSION/scripts/app_build.vdf\" +quit"
