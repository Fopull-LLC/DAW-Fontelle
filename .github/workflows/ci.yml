name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Line tables only: full debug info across a hundred test binaries filled
  # the runner's disk, and the linker died of it (`ld terminated with
  # signal 7`). A panic's backtrace still names lines.
  CARGO_PROFILE_DEV_DEBUG: "1"
  CARGO_INCREMENTAL: "0"

jobs:
  # Ty's standing rule (the hub's PROTOCOL.md §3a): no attribution trailers
  # in any commit. `.githooks/commit-msg` refuses one locally; this refuses
  # one that got past a clone without the hook.
  trailers:
    name: no co-author trailers
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: scan pushed commits
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE" ]; then
            range="origin/$BASE..HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            range="$BEFORE..HEAD"
          else
            range="HEAD~1..HEAD"
          fi
          bad=0
          for c in $(git rev-list "$range"); do
            if git show -s --format=%B "$c" | grep -qiE '^co-authored-by:|generated with|🤖'; then
              echo "::error::$c carries an attribution line"; bad=1
            fi
          done
          exit $bad

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The Linux runner ships ~25 GB of toolchains this build never touches,
      # and needs the room for its own target folder.
      - name: Make room on the runner
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install Linux audio/windowing dev libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            liblilv-dev libdbus-1-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast

  benches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux audio/windowing dev libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            liblilv-dev libdbus-1-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --workspace --no-run
