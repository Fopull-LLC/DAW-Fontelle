version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
fontelle-sing = { path = "../fontelle-sing" }
# Chinese characters to pinyin, hangul to its sounds.
fontelle-lang = { path = "../fontelle-lang" }
encoding_rs = "0.8"
yaml-rust2 = "0.10"
flate2 = "1.1.9"
rayon = "1.12.0"
realfft = "3.5.0"
sha2 = "0.10.9"

