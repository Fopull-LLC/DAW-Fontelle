[package]
name = "fontelle-app"
description = "The Fontelle DAW binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "fontelle"
path = "src/main.rs"

[dependencies]
fontelle-types = { path = "../fontelle-types" }
fontelle-core = { path = "../fontelle-core" }
fontelle-dsp = { path = "../fontelle-dsp" }
fontelle-fx = { path = "../fontelle-fx" }
fontelle-model = { path = "../fontelle-model" }
fontelle-sequencer = { path = "../fontelle-sequencer" }
fontelle-engine = { path = "../fontelle-engine" }
fontelle-host = { path = "../fontelle-host" }
fontelle-bridge-abi = { path = "../fontelle-bridge-abi" }
fontelle-midi = { path = "../fontelle-midi" }
fontelle-assets = { path = "../fontelle-assets" }
fontelle-ui = { path = "../fontelle-ui" }
serde = { version = "1.0.229", features = ["derive"] }
# `float_roundtrip`: without it serde_json's fast float parser can land a
# ULP away from the number in the file, so a patch written and read back
# is not the patch that was written — which makes a preset read as edited
# the moment it is loaded (§P.6) and perturbs every float in every project
# on every open.
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
slotmap = "1.1.1"
# The updater checks a downloaded release against the `SHA256SUMS` the release
# workflow publishes beside it (`updates.rs`). Pure Rust, no C, no TLS: the
# transfer itself is `curl`'s, for the same reason the folder picker is the
# desktop's own (`desktop.rs`) — one more subprocess and nothing more linked.
sha2 = "0.10.9"

# The session log's tee and the native crash handler (`logs.rs`,
# `crashlog.rs`) — a pipe, `dup2` and `sigaction`, already in the tree for
# the engine's RT budget.
[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

# The same two on Windows, plus the desktop's own folder and file dialogs
# (`desktop.rs`), which run in-process there so they can be owned by the
# studio's window. Already in the tree under winit and wgpu.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# Built for its side effect: the CLAP bundle `tests/plugin_hosting.rs` loads.
fontelle-testplug = { path = "../fontelle-testplug" }
fontelle-testlv2 = { path = "../fontelle-testlv2" }
fontelle-testbridge = { path = "../fontelle-testbridge" }
fontelle-testvst3 = { path = "../fontelle-testvst3" }
