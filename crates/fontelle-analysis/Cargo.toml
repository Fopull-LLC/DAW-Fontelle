[package]
name = "fontelle-analysis"
description = "Offline musical analysis of audio: notes (basic-pitch), pitch tracks, key, chords and how sure it is. Pure: no UI, no engine, no I/O beyond what it is handed (docs/analyze-musically-plan.md)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true

[features]
# The basic-pitch model, embedded and run with tract (pure Rust). Off, the
# crate builds without the model and its runtime; the classic engine is the
# fallback (plan §2.2).
default = ["model"]
model = ["dep:tract-onnx"]

[dependencies]
fontelle-dsp = { path = "../fontelle-dsp" }
# Resampling to basic-pitch's 22 050 Hz.
rubato = "5.0.0"
audioadapter-buffers = "5.2.0"
tract-onnx = { version = "0.23.8", optional = true }

[dev-dependencies]
# The model file's hash is pinned against the reviewed one (licenses/MODELS.md).
sha2 = "0.10.9"
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "analysis"
harness = false
required-features = ["model"]
