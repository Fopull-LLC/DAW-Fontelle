[package]
name = "fontelle-types"
description = "Shared identity, addressing, and event primitives used across the fontelle-core / fontelle-model / fontelle-engine boundary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
# `float_roundtrip`: without it serde_json's fast float parser can land a
# ULP away from the number in the file, so a patch written and read back
# is not the patch that was written — which makes a preset read as edited
# the moment it is loaded (§P.6) and perturbs every float in every project
# on every open.
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
slotmap = { version = "1.1.1", features = ["serde"] }
uuid = { version = "1.25.0", features = ["v7", "serde"] }
