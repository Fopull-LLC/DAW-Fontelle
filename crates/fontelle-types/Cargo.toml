[package]
name = "fontelle-types"
description = "Shared identity, addressing, and event primitives used across the fontelle-core / fontelle-model / fontelle-engine boundary."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
slotmap = { version = "1.1.1", features = ["serde"] }
uuid = { version = "1.25.0", features = ["v7", "serde"] }
