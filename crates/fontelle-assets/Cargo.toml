[package]
name = "fontelle-assets"
description = "SF2/sf3/sfz and audio-clip sample loading, streaming, peak generation, and soundfont library indexing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
fontelle-core = { path = "../fontelle-core" }
fontelle-dsp = { path = "../fontelle-dsp" }
fontelle-model = { path = "../fontelle-model" }
fontelle-types = { path = "../fontelle-types" }
midly = { version = "0.5.3", default-features = false, features = ["std"] }
notify = "8.2.0"
slotmap = "1.1.1"
soundfont = "0.1.0"
symphonia = { version = "0.6.1", features = ["wav", "flac", "mp3", "vorbis"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# A file's name by its contents (`content_hash.rs`, docs/collab-plan.md §7.1).
sha2 = "0.10.9"
