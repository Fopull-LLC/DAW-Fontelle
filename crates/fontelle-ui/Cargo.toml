[package]
name = "fontelle-ui"
description = "Custom widget layer over wgpu, windowed by winit (app) or baseview (plugin editor). Retained tree, dirty-region invalidation, virtualised timeline/piano-roll canvases."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
baseview = "0.3.2"
cosmic-text = { version = "0.17.0", features = ["peniko"] }
# Read-only. The roll is a *view* of the document and never a mutator
# (INVARIANT 2): it reads notes and emits `RollEdit`s, and `fontelle-app` turns
# those into commands. It does not — and must not — depend on `fontelle-engine`;
# that pairing is `fontelle-app`'s alone.
fontelle-model = { path = "../fontelle-model" }
fontelle-types = { path = "../fontelle-types" }
serde = { version = "1.0.229", features = ["derive"] }
# `float_roundtrip`: without it serde_json's fast float parser can land a
# ULP away from the number in the file, so a patch written and read back
# is not the patch that was written — which makes a preset read as edited
# the moment it is loaded (§P.6) and perturbs every float in every project
# on every open.
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
vello = "0.10.0"
winit = "0.30.13"
# Decodes the two PNGs compiled in from `assets/branding/` — the logo the
# start menu draws and the icon the window wears. See `branding.rs` for why
# the logo is tinted rather than drawn as shipped.
png = "0.18.1"
# A theme's backdrop images ride inside the `.fontelletheme` file, so one
# file shares the whole look: base64 in the JSON (the version already in the
# tree), and JPEG as well as PNG, because a wallpaper is usually a JPEG.
base64 = "0.22.1"
zune-jpeg = "0.4"
zune-core = "0.4"
# A theme's moving backdrop is WGSL, checked with naga before wgpu sees it:
# wgpu's answer to a bad shader is a panic on another thread. The version
# wgpu 29 already links, with its WGSL reader on.
naga = { version = "29.0.4", features = ["wgsl-in"] }

# Bringing an editor window to the front under Wayland — see `activation.rs`.
# `winit` already speaks the protocol to get a window *created* in front, and
# exposes nothing for raising one that is open; these are the same crates it
# uses, at the versions it already resolved, so nothing new is linked.
[target.'cfg(target_os = "linux")'.dependencies]
wayland-backend = { version = "0.3.17", features = ["client_system"] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
# Where the pointer is while a file is being dragged over the window under
# X11 — the drag's source holds the pointer grab, so winit hears nothing.
# See `file_drag.rs`. The same crate `fontelle-host` embeds plugin editors
# with; nothing new is linked.
x11rb = "0.13.2"

[dev-dependencies]
slotmap = { version = "1.1.1", features = ["serde"] }
