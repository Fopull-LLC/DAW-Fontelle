[package]
name = "fontelle-core"
description = "The Fontelle sampler engine. RT-safe. Constructs from a patch description, receives events, renders audio, reports parameters. Knows nothing about the DAW, files, or the GUI (INVARIANT 4)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
fontelle-types = { path = "../fontelle-types" }
fontelle-dsp = { path = "../fontelle-dsp" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
slotmap = "1.1.1"
