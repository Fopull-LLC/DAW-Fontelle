[package]
name = "fontelle-core"
description = "The Fontelle sampler engine. RT-safe. Constructs from a patch description, receives events, renders audio, reports parameters. Knows nothing about the DAW, files, or the GUI (INVARIANT 4)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
fontelle-types = { path = "../fontelle-types" }
fontelle-dsp = { path = "../fontelle-dsp" }
serde = { version = "1.0.229", features = ["derive"] }
# `float_roundtrip`: without it serde_json's fast float parser can land a
# ULP away from the number in the file, so a patch written and read back
# is not the patch that was written — which makes a preset read as edited
# the moment it is loaded (§P.6) and perturbs every float in every project
# on every open.
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
slotmap = "1.1.1"

[dev-dependencies]
# The first bench in the tree (TDD §20.5,  §10). A
# dev-dependency, so nothing it brings with it reaches the binary — which is
# the only reason a project this deliberately lean takes a tree this size.
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "flopsynth"
harness = false
