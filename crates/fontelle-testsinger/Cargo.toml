[package]
name = "fontelle-testsinger"
description = "A singer engine that hums each note as a soft vowel, built only so the vocal track's loader, scheduler and playback have something real to load."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fontelle-singer-abi = { path = "../fontelle-singer-abi" }
# Its ABI 2 self reads and writes the contract's JSON.
fontelle-sing = { path = "../fontelle-sing" }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }

# Which engine it is depends on the file it was loaded from (`v2::mode`).
[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

# Its window paints a colour into the X11 window a host gives it.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13.2"
