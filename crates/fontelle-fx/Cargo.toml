[package]
name = "fontelle-fx"
description = "Built-in effects (EQ, compressor, reverb, delay, distortion, bitcrush, repitcher, Soften, utilities). DSP only — adapted to the audio graph by fontelle-engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
fontelle-dsp = { path = "../fontelle-dsp" }
fontelle-types = { path = "../fontelle-types" }
realfft = "3.5.0"

[dev-dependencies]
fontelle-types = { path = "../fontelle-types" }
# `docs/tune-plan.md` §10: the corrector is the first effect here with a cost
# worth measuring rather than reasoning about — a YIN search per hop is not a
# filter's four multiplies. A dev-dependency, like `fontelle-core`'s.
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "tune"
harness = false
