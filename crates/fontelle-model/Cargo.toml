[package]
name = "fontelle-model"
description = "The document model: Project, channels, mixer, lanes, clips, prefabs, commands and undo, serialisation. Depends on nothing in the workspace except shared id types (INVARIANT 8)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
fontelle-types = { path = "../fontelle-types" }
serde = { version = "1.0.229", features = ["derive"] }
# `float_roundtrip`: without it serde_json's fast float parser can land a
# ULP away from the number in the file, so a patch written and read back
# is not the patch that was written — which makes a preset read as edited
# the moment it is loaded (§P.6) and perturbs every float in every project
# on every open.
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
slotmap = { version = "1.1.1", features = ["serde"] }
# A shared session's own messages (`wire::Msg`, docs/collab-plan.md §8.2):
# the same format, and the same version, as the Floptle relay they ride on.
postcard = { version = "1", features = ["use-std"] }
# `Project::sync_hash` (docs/collab-plan.md §5.6): the same xxhash64
# `fontelle-assets` already names soundfonts by.
twox-hash = { version = "2.1.4", default-features = false, features = ["xxhash64"] }
uuid = { version = "1.25.0", features = ["v7", "serde"] }
