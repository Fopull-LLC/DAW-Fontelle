[package]
name = "fontelle-engine"
description = "Audio graph, transport, voice management, mixer topology, device I/O. Owns the RT thread (INVARIANT 1: never allocates, locks, blocks, or syscalls)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
fontelle-types = { path = "../fontelle-types" }
fontelle-core = { path = "../fontelle-core" }
fontelle-fx = { path = "../fontelle-fx" }
fontelle-host = { path = "../fontelle-host" }
fontelle-dsp = { path = "../fontelle-dsp" }
cpal = "0.18.2"
# `float_roundtrip`: without it serde_json's fast float parser can land a
# ULP away from the number in the file, so a patch written and read back
# is not the patch that was written — which makes a preset read as edited
# the moment it is loaded (§P.6) and perturbs every float in every project
# on every open.
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
rtrb = "0.4.0"
triple_buffer = "9.0.0"
audio_thread_priority = "0.37.0"
rubato = "5.0.0"
# The shared-memory protocol to the separate ASIO helper (`output_asio.rs`,
# docs/asio.md). MIT/Apache; the helper itself is a GPL program Fontelle
# only ever starts, never links.
fontelle-audio-ipc = { path = "../fontelle-audio-ipc" }

# Linux only: the PipeWire ALSA plugin is opened directly for capture — see
# `pipewire.rs`. Every other platform captures through `cpal` alone.
[target.'cfg(target_os = "linux")'.dependencies]
alsa = "0.11.0"
# `rt_budget`: the real-time CPU budget and the SIGXCPU watchdog.
libc = "0.2.189"
# Output backends to choose from in Settings besides ALSA: JACK (loaded at run
# time, so a machine without it builds and runs the same) and PulseAudio
# (a client in Rust; PipeWire answers it as pipewire-pulse). cpal's own
# PipeWire host needs libpipewire's headers to build and is left out.
cpal = { version = "0.18.2", features = ["jack", "pulseaudio"] }

# Fontelle's own WASAPI modes (`wasapi.rs`): exclusive, and IAudioClient3's
# low-latency shared mode, neither of which cpal offers. Already in the tree
# under cpal, at this version.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Devices_Properties",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }

[dev-dependencies]
fontelle-assets = { path = "../fontelle-assets" }
# Built for its side effect: the test bundle `tests/plugin_nodes.rs` loads.
fontelle-testplug = { path = "../fontelle-testplug" }
fontelle-testlv2 = { path = "../fontelle-testlv2" }
slotmap = "1.1.1"
