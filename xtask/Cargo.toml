[package]
name = "xtask"
description = "Build/bundle/package automation (cargo xtask ...). Not part of the public crate graph."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
fontelle-types = { path = "../crates/fontelle-types" }
fontelle-core = { path = "../crates/fontelle-core" }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
