# cargo-deny configuration (FONTELLE_TDD.md §3.4).
# GPL and LGPL dependencies are prohibited. Anything else must be one of the
# licences explicitly allowed below.

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-apple-darwin" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    # `midly`, the MIDI file parser: public domain, same terms as CC0.
    "Unlicense",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own crates name each other by path alone, as a workspace
# with one version for the whole of it does; that is not the wildcard this
# check exists to catch, and none of these crates is published.
allow-wildcard-paths = true

[advisories]
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
