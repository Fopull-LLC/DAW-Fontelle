# cargo-deny configuration (FONTELLE_TDD.md §3.4).
# GPL and LGPL dependencies are prohibited. Anything else must be one of the
# licences explicitly allowed below.

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-apple-darwin" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    # `midly`, the MIDI file parser: public domain, same terms as CC0.
    "Unlicense",
    # `webpki-roots`, the public certificate roots a managed relay's certificate
    # is checked against when a song is shared (`fontelle-net`,
    # docs/collab-plan.md §9.1): Mozilla's root list as data, under the
    # Community Data License Agreement — permissive, no copyleft.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
# One crate of the workspace's own is GPL, and it is not a dependency of
# anything: `fontelle-asio-host` builds `fontelle-asio`, the separate
# program that hosts an ASIO driver, which uses Steinberg's ASIO SDK under
# the SDK's GPLv3 option (docs/asio.md). Fontelle never links it and it never
# loads Fontelle's code; the two exchange plain data. Every crate it uses is
# one of the permissive licences above. If anything ever depends on it, the
# `deny` below fails.
exceptions = [
    { name = "fontelle-asio-host", allow = ["GPL-3.0-only"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own crates name each other by path alone, as a workspace
# with one version for the whole of it does; that is not the wildcard this
# check exists to catch, and none of these crates is published.
allow-wildcard-paths = true
# The GPL helper is a program, never a library of Fontelle's: a crate that
# depends on it would put GPL code into an MIT/Apache build.
deny = [
    { crate = "fontelle-asio-host", wrappers = [] },
]

[advisories]
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
